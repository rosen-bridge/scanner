image: $GITLAB_CI_IMAGE

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /push|web/'
      when: always
    - when: never

stages:
  - installation
  - build
  - triggers

include:
  - component: $CI_SERVER_FQDN/${INSTALL_BUILD_COMPONENT}

run_ci:
  stage: triggers
  trigger:
    include:
      - local: .gitlab/workflows/ci.yml
    strategy: mirror

run_snapshot_publish:
  stage: triggers
  rules:
    - when: manual
  allow_failure: true
  trigger:
    include:
      - local: .gitlab/workflows/snapshot-publish.yml
    strategy: mirror

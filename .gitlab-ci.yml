image: node:22.18

stages:
  - installation
  - build
  - triggers

installation:
  stage: installation
  cache:
    key: $CI_COMMIT_REF_NAME
    policy: push
    paths:
      - node_modules
      - '**/node_modules'
  script:
    - npm ci

build:
  stage: build
  cache:
    key: $CI_COMMIT_REF_NAME
    policy: pull-push
    paths:
      - node_modules
      - '**/node_modules'
      - '**/dist'
  script:
    - npm run build

run_ci:
  stage: triggers
  trigger:
    include:
      - local: .gitlab/workflows/ci.yml
    strategy: mirror

run_snapshot_release:
  stage: triggers
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
  variables:
    NPM_TOKEN: $NPM_TOKEN
  trigger:
    include:
      - local: .gitlab/workflows/snapshot-release.yml
    strategy: mirror
    forward:
      pipeline_variables: true
